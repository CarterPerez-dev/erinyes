# release.yml

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test before shipping anything
        run: |
          go test ./... -race
          go vet ./...
          go run ./cmd/erinyes signatures validate ./signatures

      - name: build every platform and package it
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make package VERSION="$RELEASE_TAG"

      - name: show what will be published
        run: cat dist/checksums.txt

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            install.sh
            uninstall.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
