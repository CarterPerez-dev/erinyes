# pymapper_fs.yaml

id: pymapper-fs-loader
version: 1
family: PyMapper
severity: critical
confidence_threshold: 60
file_patterns: ["*.py"]

first_seen: 2026-10-14
contributor: carterperez-dev
description: >
  Stage-1 Python loader from the PyMapper malware-as-a-service platform.
  Uses a one-line XOR lambda to decode imports and encryption keys, then an
  HMAC-SHA256 keystream decrypts an embedded blob to reveal a reflective PE
  loader. The variable-name template (_rd9r1n, _spd980k, _trtmhwg1q, _nt6xwy)
  is NOT an operator fingerprint — one developer (hkqr) was observed cycling
  through four templates on the same file in three weeks, so attribution
  must rest on infrastructure (C2 hosts, bearer tokens, embedded-PE SHA)
  rather than template literals. Every indicator here matches structure.
references:
  - "Operation CLAUDEIUS, Perez & Claude, 2026"
  - "hkqr dev-environment forensics: analysis/HKQR-OPSEC-FINDINGS.md"
  - "C2 hosts observed in hkqr/my-free-code plaintext commits (2026-10):"
  - "  http://85.121.179.7:8000  (Operator B admin plane, PyMapper v0.5 client)"
  - "  91.92.47.134:8765         (new, port matches PyMapper implant plane)"
  - "  172.233.51.81:8765        (new, Linode 172.233/8 — same hoster family as Op A)"
  - "Bearer token (HMAC-SHA256 signing key):"
  - "  e6adfdbe87e1d8ae9afc2856e6d39e5adb7fffa6fd879cff19bcb5052929a332"
  - "Stage-2 PE SHA-256 pulled from Op B /pe/hash/{sha}:"
  - "  464bc0bd3e716d5276909c4b2cf0817f8579d5fd4bcc784557b74ec6f66fa403"

indicators:
  - name: xor_decoder_lambda
    weight: 40
    type: regex
    pattern: 'lambda\s+\w+\s*,\s*\w+\s*:\s*bytes\(\s*\w+\s*\^\s*\w+\s+for\s+\w+\s+in\s+\w+\s*\)'

  - name: import_via_xor_decoder
    weight: 25
    type: regex
    pattern: '__import__\(\s*\w+\(\s*\[\s*\d+'

  - name: rolling_xor_checksum
    weight: 30
    type: regex
    pattern: 'sum\(\s*\(\s*\w+\[\s*\w+\s*\]\s*\+\s*\w+\s*\)\s*\^\s*\w+\s+for\s+\w+\s+in\s+range\(\s*len\(\s*\w+\s*\)\s*\)\s*\)\s*&\s*255'

  - name: hmac_keystream_block
    weight: 20
    type: regex
    pattern: 'min\(\s*32\s*,\s*len\(\s*\w+\s*\)\s*-\s*\w+\s*\)'

  - name: embedded_encrypted_blob
    weight: 25
    type: regex
    pattern: '\[(?:\s*\d{1,3}\s*,){80,}'

  - name: getattr_name_hiding
    weight: 15
    type: regex
    pattern: 'getattr\(\s*\w+\s*,\s*\w+\(\s*\[\s*\d'

retrohunt:
  github_queries:
    - '"lambda a,k:bytes(v^k for v in a)" language:python'
    - '"bytes(v^k for v in a)" language:python'
    - '"return sum((w[i]+p)^i for i in range(len(w)))&255" language:python'
    - '"o=bytearray(len(d));p=c=0" language:python'
    - '"t=min(32,len(d)-p)" language:python'
    - '"for i in range(t):o[p+i]=d[p+i]^b[i]" language:python'
    - '"_rd9r1n" language:python'
    - '"_spd980k" language:python'
    - '"_trtmhwg1q" language:python'
    - '"_nt6xwy" language:python'
    - '"X-PyMapper-Client" language:python'
    - '"pymapper-client/0.5" language:python'
  rate_limit_rps: 1.0

